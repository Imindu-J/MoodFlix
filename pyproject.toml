[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "moodflix"
version = "0.1.0"
description = "A conversational movie recommendation system with WhatsApp integration."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi[standard-no-fastapi-cloud-cli]>=0.115,<1.0",
    "pydantic-settings>=2.7,<3.0",
    "alembic>=1.14,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "sqlalchemy>=2.0,<3.0",
    "httpx>=0.28,<1.0",
    "pgvector>=0.5,<1.0",
    "sentence-transformers>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10.0",
    "pytest-cov>=6.0,<8.0",
    "ruff>=0.9,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
